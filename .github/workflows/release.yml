name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -s tests
      - run: python scripts/quickstart.py --out output/smoke
      - run: python -m build
      - name: Inspect distributions
        run: python scripts/check_distribution.py
      - name: Checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          files = sorted(Path("dist").iterdir())
          Path("dist/SHA256SUMS.txt").write_text("\n".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name for p in files) + "\n")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --title "PhaseGraph ${{ github.ref_name }}" --notes-file .github/release-notes.md
