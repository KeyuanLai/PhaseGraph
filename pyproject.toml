[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasegraph-research"
version = "0.1.1"
description = "Extract and compare phase-region networks from phase-diagram images"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yuanhao Li"}, {name = "Keyuan Lai"}, {name = "Jiawei Ma"}, {name = "Pengfei Guan"}]
keywords = ["phase-diagram", "materials-science", "computer-vision", "graph-distance"]
dependencies = ["numpy>=1.24", "pandas>=2", "networkx>=3", "opencv-python>=4.8,<5", "scipy>=1.10", "scikit-learn>=1.3", "Pillow>=10", "tqdm>=4"]

[project.urls]
Repository = "https://github.com/KeyuanLai/PhaseGraph"
Issues = "https://github.com/KeyuanLai/PhaseGraph/issues"
Documentation = "https://github.com/KeyuanLai/PhaseGraph/tree/main/docs"

[project.optional-dependencies]
dev = ["build>=1", "matplotlib>=3.9", "PyYAML>=6", "threadpoolctl>=3"]

[project.scripts]
phasegraph = "phasegraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


